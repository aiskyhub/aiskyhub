interface:
  display_name: "小说转完整漫画"
  short_description: "全书剧本先行，按画质单次生成1–4格，无损分格与逐格验收，保持人物一致和成品清晰"
  default_prompt: "使用 $novel-to-comic 将我提供的小说忠实改编为完整漫画，先完成全书剧本与校验；按画质自适应单次生成1–4格，普通镜头优先合并，复杂格单独绘制，无损分格并逐格验收原生细节；画面干净优雅、配色清透、背景简洁，男女角色外观清晰，主角精致且不同人物各有面孔与体态；最新 Luna 子代理按最高思考度执行独立制作，主代理亲自负责审美与验收，所有资料保存在统一作品项目中。"
